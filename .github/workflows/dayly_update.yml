name: Daily Image Update

on:
  schedule:
    - cron: '0 17 * * *'  # 毎日午前2時JST
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        pip install gspread google-api-python-client google-auth-httplib2 google-auth-oauthlib
      
    - name: Run image download script
      env:
        GOOGLE_CREDENTIALS: ${{ c770ff952da43ce42d4d7a90abaa3b01f247662a }}
      run: python scripts/daily_update.pypy -3 -c "import os; print('GOOGLE_CREDENTIALS' in os.environ); print(os.environ.get('GOOGLE_CREDENTIALS'))"

