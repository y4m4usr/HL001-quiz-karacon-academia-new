<!DOCTYPE html><html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Quiz☆カラコンアカデミア</title>

  <!-- CSP: GAS API / GitHub Raw / jsDelivr を許可 -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self' https://www.gstatic.com https://apis.google.com;
    script-src  'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com;
    connect-src 'self' https://script.google.com https://script.googleusercontent.com https://raw.githubusercontent.com https://cdn.jsdelivr.net;
    img-src     'self' data: blob: https://raw.githubusercontent.com https://cdn.jsdelivr.net;
    style-src   'self' 'unsafe-inline';
    font-src    'self' data:;
    frame-src   https://script.google.com https://script.googleusercontent.com;
    frame-ancestors 'self' https://script.google.com https://script.googleusercontent.com;
    worker-src  'self' blob:;
  ">

  <style>
    html,body,*{
      font-family:"Noto Sans JP", system-ui, -apple-system, "Segoe UI",
                  "Hiragino Kaku Gothic ProN","Meiryo", sans-serif;
    }
    body{ margin:0; background:#fafafa; }
    .wrap{ max-width:960px; margin:32px auto; padding:16px; }
    .card{ background:#fff; border-radius:16px; box-shadow:0 6px 18px rgba(0,0,0,.06); padding:20px; }
    .meta{ color:#666; font-size:12px; margin-bottom:12px; }
    .qimg{ width:100%; max-height:520px; object-fit:contain; border-radius:12px; background:#f1f1f1; }
    .opts{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
    button.opt{ padding:12px 14px; border-radius:12px; border:1px solid #e5e7eb; background:#fff; cursor:pointer; }
    button.opt:hover{ background:#f9fafb; }
    .loading{ padding:24px; text-align:center; color:#666; }
    .err{ color:#b00020; white-space:pre-wrap; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="meta" id="meta">問題を取得中…</div>
      <img id="qimg" class="qimg" alt="レンズ画像" />
      <div class="opts" id="opts"></div>
      <div id="msg" class="err" style="margin-top:12px;"></div>
    </div>
  </div>

  <script>
  // Raw → jsDelivr フォールバック
  function toCdnFallback(rawUrl){
    try{
      return rawUrl.replace(
        /^https:\/\/raw\.githubusercontent\.com\/([^/]+)\/([^/]+)\/([^/]+)\/(.+)$/i,
        'https://cdn.jsdelivr.net/gh/$1/$2@$3/$4'
      );
    }catch(_){ return rawUrl; }
  }
  function setQuestionImage(url){
    const img = document.getElementById('qimg');
    if (!img) return;
    let tried = false;
    img.onerror = function(){
      if (tried) return;
      tried = true;
      this.src = toCdnFallback(this.currentSrc || url);
    };
    img.src = url;
  }

  (function(){
    const meta = document.getElementById('meta');
    const img  = document.getElementById('qimg');
    const opts = document.getElementById('opts');
    const msg  = document.getElementById('msg');

    const BASE = location.origin + location.pathname; // 同一WebApp
    const ITEMS_URL = BASE + '?action=items';

    function load(){
      meta.textContent = '問題を取得中…';
      msg.textContent = '';
      opts.innerHTML = '';
      img.removeAttribute('src');

      fetch(ITEMS_URL, { method:'GET', mode:'cors', credentials:'omit' })
        .then(r => r.ok ? r.json() : Promise.reject(new Error('items fetch '+r.status)))
        .then(data => {
          if (!data || !data.items || !data.items.length) throw new Error('問題データが空です');
          const q = data.items[0];
          meta.textContent = `CK: ${q.correct.E} | ${q.correct.I} | ${q.correct.J} | ${q.correct.K}`;

          // 画像（raw→CDNフォールバック）
          setQuestionImage(q.image);

          // 選択肢
          q.options.forEach(o => {
            const b = document.createElement('button');
            b.className = 'opt';
            b.textContent = o.label;
            b.onclick = () => {
              if (o.isCorrect) {
                b.style.background = '#ecfdf5'; b.style.borderColor = '#10b981';
                meta.textContent = '✅ 正解！';
              } else {
                b.style.background = '#fef2f2'; b.style.borderColor = '#ef4444';
                meta.textContent = '❌ 不正解…';
              }
            };
            opts.appendChild(b);
          });
        })
        .catch(e => { msg.textContent = '読み込みエラー: ' + e.message; });
    }
    document.addEventListener('DOMContentLoaded', load);
  })();
  </script>
</body>
</html>
